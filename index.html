<div class="card">
  <div class="label">⭐ YOUR POINTS</div>
  <div class="balance" id="points">0</div>
  <button onclick="addPoint()">+ ADD POINT</button>
</div>

<script>
let points = Number(localStorage.getItem("tapverse_points")) || 0;

function addPoint(){
  points++;
  localStorage.setItem("tapverse_points", points);
  document.getElementById("points").textContent = points;
}

document.getElementById("points").textContent = points;
</script>
