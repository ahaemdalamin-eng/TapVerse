<div class="item" style="grid-column:1/3;">
  <h3>💰 Withdraw / Exchange</h3>

  <button onclick="selectPayment('bKash')"
  style="background:#e2136e;color:white;margin:8px;">
    bKash
  </button>

  <button onclick="selectPayment('Nagad')"
  style="background:#f58220;color:white;margin:8px;">
    Nagad
  </button>

  <div id="paymentBox" style="margin-top:15px;"></div>
</div>

<script>
function selectPayment(method) {
  document.getElementById("paymentBox").innerHTML = `
    <h3>${method} Selected</h3>
    <input id="number" type="tel"
    placeholder="Enter ${method} number"
    style="padding:12px;width:100%;margin:12px 0;
    border-radius:10px;border:0;">

    <input id="amount" type="number"
    placeholder="Enter amount"
    style="padding:12px;width:100%;
    border-radius:10px;border:0;">

    <button onclick="alert('Demo only! Withdraw system is not connected.')">
      Continue
    </button>
  `;
}
</script>
