<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapVerse</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #10131d;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.level {
  font-size: 22px;
  font-weight: bold;
}

.progress {
  color: #a6a6b5;
  margin-top: 8px;
  font-size: 13px;
}

.bar {
  height: 7px;
  background: #343849;
  border-radius: 10px;
  margin-top: 10px;
}

.bar span {
  display: block;
  width: 90%;
  height: 100%;
  background: #a5ff48;
  border-radius: 10px;
}

.coins {
  text-align: center;
  margin: 45px 0 35px;
}

.coins h1 {
  font-size: 38px;
  color: #b5ff54;
  margin: 12px;
}

.coins p {
  color: #aaa;
}

.daily {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.item {
  background: #202638;
  padding: 22px 12px;
  border-radius: 17px;
  text-align: center;
  border: 1px solid #343b50;
}

.item h3 {
  font-size: 16px;
  margin-bottom: 12px;
}

.item p {
  color: #b5ff54;
  font-size: 20px;
  font-weight: bold;
}

.item button {
  margin-top: 14px;
  background: #b5ff54;
  color: #111;
  border: none;
  padding: 9px 18px;
  border-radius: 20px;
  font-weight: bold;
}

.bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #202638;
  display: flex;
  justify-content: space-around;
  padding: 17px 5px;
}

.bottom div {
  text-align: center;
  color: #aaa;
  font-size: 12px;
}

.bottom b {
  display: block;
  color: white;
  font-size: 14px;
  margin-bottom: 5px;
}
</style>
</head>

<body>

<div class="header">
  <div>
    <div class="level">Grandmaster ></div>
    <div class="progress">9/10 • 90% Progress</div>
    <div class="bar"><span></span></div>
  </div>
  <div style="color:#b5ff54;font-weight:bold">+1.22M</div>
</div>

<div class="coins">
  <p>YOUR TOTAL COINS</p>
  <h1 id="coins">73,345,358</h1>
  <p>TapVerse Balance</p>
</div>

<div class="daily">

  <div class="item">
    <h3>🎁 Daily Reward</h3>
    <p>+5,000</p>
    <button onclick="reward()">Claim</button>
  </div>

  <div class="item">
    <h3>🔐 Daily Cipher</h3>
    <p>11:47</p>
    <button onclick="alert('Daily Cipher')">Open</button>
  </div>

  <div class="item">
    <h3>🔥 Daily Combo</h3>
    <p>06:47</p>
    <button onclick="alert('Daily Combo')">Play</button>
  </div>

  <div class="item">
    <h3>⏰ Next Bonus</h3>
    <p>23:47</p>
    <button onclick="alert('Coming Soon')">View</button>
  </div>

</div>

<div style="height:100px"></div>

<div class="bottom">
  <div><b>🏦</b>Exchange</div>
  <div><b>⛏️</b>Mine</div>
  <div><b>👥</b>Friends</div>
  <div><b>🎁</b>Earn</div>
</div>

<script>
let balance = Number(localStorage.getItem("tv_coins")) || 73345358;

function update() {
  document.getElementById("coins").innerText =
    balance.toLocaleString("en-US");
}

function reward() {
  if (localStorage.getItem("tv_reward_date") ===
      new Date().toDateString()) {
    alert("Today's reward already claimed!");
    return;
  }

  balance += 5000;
  localStorage.setItem("tv_coins", balance);
  localStorage.setItem("tv_reward_date",
    new Date().toDateString());

  update();
  alert("5000 Coins Added!");
}

update();
</script>

</body>
</html>
